### ⚠️ REFERENCE COPY - NOT the file that is deployed.
###
### The authoritative compose file lives on the VPS at
### /root/amiticia-site/amiticia-site.yml. CI never uploads this one: the deploy
### step in .github/workflows/deploy.yml only runs `docker compose pull && up -d`
### against the file already on the host.
###
### This copy exists to document the deployed topology. Keep it in sync by hand,
### and NEVER copy it up verbatim - the BasicAuth credential below is a
### placeholder, so deploying this file as-is would leave /k unauthenticated.
###
### Use (on the VPS): `docker compose -f amiticia-site.yml up -d`

services:
  amiticia:
    image: ghcr.io/eusoubrasileiro/amitic-ai-core:latest
    pull_policy: always
    restart: unless-stopped
    networks:
      - network_public
    volumes:
      # live amiticia-knowledge clone - read-only; nginx serves /k/data/ from here
      - /storage/knowledge:/knowledge:ro
      # bearer token for the /k/api/ research proxy, injected server-side by nginx
      - /storage/amiticia-site/research-auth.conf:/etc/nginx/research-auth.conf:ro
    labels:
      - "traefik.enable=true"
      # Docker provider → use traefik.docker.network
      - "traefik.docker.network=network_public"
      # --- main marketing site (public) ---
      # v3 syntax: one host per Host(), combined with ||
      - "traefik.http.routers.amiticia.rule=Host(`amiticia.cc`) || Host(`www.amiticia.cc`)"
      - "traefik.http.routers.amiticia.entrypoints=websecure"
      - "traefik.http.routers.amiticia.tls.certresolver=myresolver"
      # service/port Traefik should hit
      - "traefik.http.services.amiticia.loadbalancer.server.port=3000"
      # health check so Traefik waits until the app is actually serving
      - "traefik.http.services.amiticia.loadbalancer.healthcheck.path=/"
      - "traefik.http.services.amiticia.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.amiticia.loadbalancer.healthcheck.timeout=3s"
      # --- private knowledge page - /k path, BasicAuth-gated, higher priority ---
      # priority=100 so this wins over the catch-all router above for /k*.
      - "traefik.http.routers.amiticia-k.rule=(Host(`amiticia.cc`) || Host(`www.amiticia.cc`)) && PathPrefix(`/k`)"
      - "traefik.http.routers.amiticia-k.entrypoints=websecure"
      - "traefik.http.routers.amiticia-k.tls.certresolver=myresolver"
      - "traefik.http.routers.amiticia-k.priority=100"
      - "traefik.http.routers.amiticia-k.middlewares=amiticia-k-auth"
      # PLACEHOLDER. The real hash lives ONLY in /root/amiticia-site/amiticia-site.yml
      # on the VPS. This repo is PUBLIC - never commit the credential here.
      # Regenerate with:  htpasswd -nbB andre '<password>' | sed -e 's/\$/\$\$/g'
      - "traefik.http.middlewares.amiticia-k-auth.basicauth.users=andre:$$REPLACE_ON_VPS"
      # --- HTTP → HTTPS redirect on the web entrypoint ---
      - "traefik.http.routers.amiticia-redirect.rule=Host(`amiticia.cc`) || Host(`www.amiticia.cc`)"
      - "traefik.http.routers.amiticia-redirect.entrypoints=web"
      - "traefik.http.routers.amiticia-redirect.middlewares=amiticia-https"
      - "traefik.http.middlewares.amiticia-https.redirectscheme.scheme=https"

networks:
  network_public:
    external: true
    name: network_public
